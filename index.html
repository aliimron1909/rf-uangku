<style>
:root{--bg:#eef3f1;--fg:#14201c;--card:#fff;--bd:#c5d3ce;--mut:#44574f;--mut2:#6b7d76;--warn:#fff4d6;--acc:#0f5c4d;--sh:#0f5c4d22;color-scheme:light}

body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px var(--sh)}

.warn{background:var(--warn);border:1px solid #f2a900;border-radius:10px;padding:10px;margin-bottom:10px;font-size:13px}

.text-gray-500,.text-gray-600{color:var(--mut2)!important}

<script>
// ===== KONFIGURASI PENJUAL (isi sebelum rilis) =====
const API_BASE=''/* kosong = server lisensi & sync ada di domain yang sama dengan aplikasi (/api/lisensi, /api/sync). Isi bila aplikasi dihosting di domain lain, mis. https://omset-warmad.vercel.app */,
  LICENSE_URL=(API_BASE||location.origin)+'/api/lisensi', ADMIN_WA='6285939309321',/* contoh 6281234567890 */ PREMIUM_PRICE='Rp 100.000';
const $=s=>document.querySelector(s),LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const MODES={pemilik_suami_istri:'Pemilik (Suami Istri)',pemilik_1_karyawan:'Pemilik + 1 Karyawan',karyawan_suami_istri:'Karyawan Suami Istri',dua_karyawan:'2 Karyawan',suami_istri_gaji:'Pemilik Suami Istri + 1 Karyawan (Gaji)',kustom:'Kustom (Bebas)'};
const GK=['pinOn','pin','cred','notif','url','okey'],MAX_WARUNG=5,FREE_WARUNG=1; // gratis 1 warung, premium sampai 5
const DEF={nama:'Warung Saya',alamat:'',hp:'',boss:'Pemilik Warung',k1:'Karyawan 1',k2:'Karyawan 2',pct:10,kontrak:0,jml:1,foto:'',defMode:'pemilik_1_karyawan'};
const pickGK=o=>Object.fromEntries(GK.map(k=>[k,o[k]])),omitGK=o=>Object.fromEntries(Object.entries(o).filter(([k])=>!GK.includes(k)));
const wget=id=>LS('co_w_'+id)||{s:{},r:[],ko:{},jm:{},cn:{},sk:{},pg:{}};
const FRESH=!LS('co_g')&&!LS('co_s');
let G=LS('co_g'),S,R,KO,JM,CN,SK,PG;
if(!G){const o=LS('co_s')||{};G=Object.assign({pinOn:false,pin:'',cred:'',notif:false,url:''},pickGK(o),{active:'w1',ws:[{id:'w1',nama:o.nama||'Warung Saya'}],del:[]});
  localStorage.setItem('co_w_w1',JSON.stringify({s:omitGK(o),r:LS('co_r')||[],ko:LS('co_ko')||{},jm:LS('co_jm')||{}}));localStorage.setItem('co_g',JSON.stringify(G))}
function load(id){G.active=id;localStorage.setItem('co_g',JSON.stringify(G));const w=wget(id);S=Object.assign({},DEF,pickGK(G),w.s);if(S.boss==='Boss')S.boss='Pemilik Warung';R=w.r;KO=w.ko;JM=w.jm;CN=w.cn||{};SK=w.sk||{};PG=w.pg||{}}
G.kpins=G.kpins||{};
if(!G.dev){G.dev=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,'').slice(0,8).toUpperCase();localStorage.setItem('co_g',JSON.stringify(G))}
if(G.premium&&!(G.lic&&typeof G.lic.code==='string'&&G.lic.code)){G.premium=false;localStorage.setItem('co_g',JSON.stringify(G))}
load(G.active);
let ROLE=G.staff?'staff:'+G.staff.id:(sessionStorage.getItem('co_role')||'owner');
const isStaff=()=>ROLE.startsWith('staff:');
function applyRole(){
  if(isStaff()){const id=ROLE.slice(6);if(!G.ws.some(w=>w.id===id)||(!G.staff&&!G.kpins[id])){sessionStorage.removeItem('co_ok');sessionStorage.removeItem('co_role');location.reload();return}if(G.active!==id)load(id)}
  document.querySelectorAll('.nav').forEach(n=>{n.style.display=isStaff()&&(n.dataset.t==='1'||n.dataset.t==='4')?'none':''});
  hdr();if(isStaff()){resetUI();render();document.querySelector('[data-t="2"]').click()}
}
const wLimit=()=>G.premium?MAX_WARUNG:FREE_WARUNG;
const LK=()=>G.premium?'':' <i class="fa-solid fa-lock text-xs"></i>';
function applyTheme(){const t=G.theme||'system',dk=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dk?'dark':'light';Chart.defaults.color=dk?'#c9d6d0':'#555';Chart.defaults.borderColor=dk?'#2e3f39':'#e5e7eb'}
const resetUI=()=>{editDate=fillDate=recCycle=null;dashCycle='all'};
const allDone=()=>G.ws.every(x=>(x.id===G.active?R:wget(x.id).r).some(r=>r.date===today()));

let editDate=null,fillDate=null,recCycle=null,dashCycle='all',charts=[],penjC=null;
const save=()=>{Object.assign(G,pickGK(S));const e=G.ws.find(x=>x.id===G.active);if(e)e.nama=S.nama;localStorage.setItem('co_g',JSON.stringify(G));localStorage.setItem('co_w_'+G.active,JSON.stringify({s:omitGK(S),r:R,ko:KO,jm:JM,cn:CN,sk:SK,pg:PG}));pushState()};
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const dmy=d=>d.split('-').reverse().join('-');
const OWN=()=>['Boss','Pemilik Warung'].includes(S.boss)?'':S.boss,PW=()=>OWN()?'Pemilik Warung ('+OWN()+')':'Pemilik Warung';
const hari=d=>['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][new Date(d+'T00:00:00').getDay()];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const cycles=()=>[...new Set([...R.map(r=>r.cycle),...Object.keys(JM).map(Number)])].sort((a,b)=>a-b);
const curCycle=()=>Math.max(1,...cycles());
const modeOf=c=>{if(JM[c])return JM[c];const k=Object.keys(JM).map(Number).filter(n=>n<c).sort((a,b)=>b-a)[0];return k?JM[k]:S.defMode};
const nameOf=(c,f)=>{const k=Object.keys(CN).map(Number).filter(n=>n<=c&&CN[n]&&CN[n][f]).sort((a,b)=>b-a)[0];return k?CN[k][f]:S[f]};
const resolveCN=w=>{const cn=w.cn||{},s=w.s||{},prev={k1:s.k1||DEF.k1,k2:s.k2||DEF.k2},out={},cs=[...new Set([...w.r.map(r=>+r.cycle),...Object.keys(w.jm||{}).map(Number),...Object.keys(cn).map(Number)])].sort((a,b)=>a-b);cs.forEach(c=>{const e=cn[c]||{};['k1','k2'].forEach(f=>{if(e[f])prev[f]=e[f]});out[c]={k1:prev.k1,k2:prev.k2}});return out};
const freezeNames=()=>cycles().forEach(c=>{CN[c]=Object.assign({},CN[c]);['k1','k2'].forEach(f=>{if(!CN[c][f])CN[c][f]=nameOf(c,f)})});
const penjCur=()=>{const cs=cycles();return penjC&&cs.includes(penjC)?penjC:(cs.length?cs[cs.length-1]:null)};
const clearTomb=c=>{if(G.dcyc&&G.dcyc[G.active])G.dcyc[G.active]=G.dcyc[G.active].filter(x=>x!==c)};
const lastMode=()=>{const k=Object.keys(JM).map(Number).sort((a,b)=>b-a)[0];return k?JM[k]:S.defMode};
const resolveJM=w=>{const jm=Object.assign({},w.jm),dm=(w.s&&w.s.defMode)||DEF.defMode,cs=[...new Set([...w.r.map(r=>+r.cycle),...Object.keys(jm).map(Number)])].sort((a,b)=>a-b);let prev=dm;cs.forEach(c=>{if(jm[c])prev=jm[c];else jm[c]=prev});return jm};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=document.createElement('div');t.textContent=m;t.className='fixed left-1/2 -translate-x-1/2 bottom-24 z-50 bg-black text-white text-sm px-4 py-2 rounded-full';document.body.appendChild(t);setTimeout(()=>t.remove(),2400)};

/* ---------- hitung bagi hasil ---------- */
function calc(c){
  const rs=R.filter(r=>r.cycle==c).sort((a,b)=>a.date.localeCompare(b.date)),mode=modeOf(c);
  const omset=rs.reduce((s,r)=>s+r.omset,0),tab=omset*S.pct/100,days=rs.length;
  const GD=guardsOf(c),L=GD.list,pp=GD.pp,nBagi=L.filter(g=>g.t==='bagi').length,pr=Math.min(days,30)/30;
  const gajiTotal=L.filter(g=>g.t==='gaji').reduce((t,g)=>t+g.g*pr,0);
  const opt=KO[c]||'zero';   // kontrak hanya bila ada penjaga bagi hasil; penjaga bergaji tidak dipotong kontrak
  let kontrak=nBagi===0?0:opt==='full'?S.kontrak:opt==='prorata'?S.kontrak*pr:0;
  if(days>=30&&nBagi>0)kontrak=S.kontrak;
  const net=tab-gajiTotal-kontrak,bossShare=nBagi?net*pp/100:net,boss=bossShare+kontrak;
  const guards=L.map(g=>({n:g.n,t:g.t,gFull:g.g,base:g.t==='gaji'?g.g*pr:(nBagi?net*(100-pp)/100/nBagi:0),stk:0}));
  const sk=SK[c]||{},num=v=>v!==undefined&&v!==null&&v!==''&&isFinite(+v),hasSt=num(sk.awal)&&num(sk.akhir),sel=hasSt?(+sk.akhir)-(+sk.awal):0;let sB=0;
  if(hasSt){   // plus: pemilik + penjaga bagi hasil sesuai porsi (tanpa kontrak); minus: dibagi rata ke semua penjaga
    if(sel>=0){if(nBagi){sB=sel*pp/100;guards.forEach(g=>{if(g.t==='bagi')g.stk=sel*(100-pp)/100/nBagi})}else sB=sel}
    else{if(guards.length)guards.forEach(g=>g.stk=sel/guards.length);else sB=sel}
  }
  guards.forEach(g=>g.total=g.base+g.stk);
  return{rs,mode,omset,tab,days,kontrak,net,gajiTotal,nBagi,pp,guards,boss,bossShare,stok:hasSt?{awal:+sk.awal,akhir:+sk.akhir,sel,note:sk.note||''}:null,stBoss:sB,bossT:boss+sB,start:rs[0]?.date,end:rs[rs.length-1]?.date}
}

/* ---------- status header ---------- */
function hdr(){
  $('#wSel').innerHTML=G.ws.map(w=>`<option style="color:#000" value="${w.id}" ${w.id===G.active?'selected':''}>${esc(w.nama)}</option>`).join('')+(G.ws.length<MAX_WARUNG?'<option style="color:#000" value="__add">+ Tambah Warung'+(G.premium?'':' (Premium)')+'</option>':'<option style="color:#000" value="" disabled>Batas '+MAX_WARUNG+' warung</option>');
  if(isStaff())$('#wSel').innerHTML='<option style="color:#000" value="'+G.active+'" selected>'+esc(S.nama)+'</option>';$('#wSel').disabled=isStaff();$('#hLock').classList.toggle('hidden',!S.pinOn);$('#staffOut').classList.toggle('hidden',!G.staff);
  $('#hLogo').src=(G.premium&&S.foto)||'./icon.svg';
  const on=navigator.onLine,n=$('#hNet');n.textContent=on?'Online':'Offline';n.style.background=on?'#1f9d55':'#c0392b';
  $('#hSync').textContent='Terakhir Sync: '+(localStorage.getItem('co_last')||'-');
}
addEventListener('online',()=>{hdr();sync(true)});addEventListener('offline',hdr);
const fmtNow=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return`${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`};

/* ---------- sync Google Sheets ---------- */
async function sync(silent){
  if(G.staff)return syncStaff(silent);
  if(!G.premium){if(!silent)toast('Sync Cloud khusus Premium');return}
  if(G.premium&&!S.url&&!S.okey&&navigator.onLine)await autoRegister(true);
  if(!S.url||!navigator.onLine){if(!silent)toast(S.url?'Offline, tersimpan lokal':'Sync cloud belum aktif. Cek lisensi Premium lalu coba lagi');return}
  try{
    save();if(!S.okey){if(!silent)toast('Isi Kode Pemilik dulu (Pengaturan > Profil)');return}const r=await gas(S.url,{action:'pull',key:S.okey,device:G.dev});
    if(r.ok===false){if(!silent)toast(r.error||'Sync gagal');return}
    if(r.ok){G.akses=r.akses||[];
      const rws=r.warung||[{id:'w1',settings:r.settings,records:r.records,cycleKontrakOptions:r.cycleKontrakOptions,cycleJagaModes:r.cycleJagaModes}];
      rws.forEach(rw=>{if((G.del||[]).includes(rw.id))return;
        const isNew=!localStorage.getItem('co_w_'+rw.id),w=isNew?{s:{},r:[],ko:{},jm:{}}:wget(rw.id),st=omitGK(rw.settings||{});
        const have=new Set(w.r.map(x=>x.date));(rw.records||[]).forEach(x=>{if(!have.has(x.date))w.r.push({date:x.date,cycle:+x.cycle,day:+x.day,omset:+x.omset,expense:x.expense||''})});
        w.ko=Object.assign({},rw.cycleKontrakOptions,w.ko);w.jm=Object.assign({},rw.cycleJagaModes,w.jm);w.cn=Object.assign({},rw.cycleNames,w.cn);w.sk=Object.assign({},rw.cycleStok,w.sk);w.pg=Object.assign({},rw.cyclePenjaga,w.pg);((G.dcyc||{})[rw.id]||[]).forEach(c=>{if(!w.r.some(x=>+x.cycle===c)){delete w.jm[c];delete w.ko[c];delete w.cn[c];delete w.sk[c];delete w.pg[c]}});
        if(isNew||!w.s.nama||w.s.nama==='Warung Saya')w.s=Object.assign({},w.s,st);
        localStorage.setItem('co_w_'+rw.id,JSON.stringify(w));
        const e=G.ws.find(x=>x.id===rw.id);if(e)e.nama=w.s.nama||e.nama;else G.ws.push({id:rw.id,nama:w.s.nama||rw.id})});
      localStorage.setItem('co_g',JSON.stringify(G))}
    const body={action:'syncAll',key:S.okey||'',device:G.dev,premium:!!G.premium,warung:G.ws.map(x=>{const w=wget(x.id);return{id:x.id,settings:Object.assign({},DEF,w.s),records:w.r,cycleKontrakOptions:w.ko,cycleJagaModes:resolveJM(w),cycleNames:resolveCN(w),cycleStok:w.sk||{},cyclePenjaga:w.pg||{}}})};
    const res=await (await fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})).json();
    if(!res.ok)throw 0;
    localStorage.setItem('co_last',fmtNow());load(G.active);hdr();render();if(!silent)toast('Sync berhasil')
  }catch(e){if(!silent)toast('Sync gagal, data tetap aman di HP')}
}

/* ---------- tab 1 dashboard ---------- */
const clone=o=>JSON.parse(JSON.stringify(o)),isCust=m=>m==='kustom'||m==='suami_istri_gaji';
const pgOf=c=>{if(PG[c])return PG[c];const k=Object.keys(PG).map(Number).filter(n=>n<c).sort((a,b)=>b-a)[0];return k!==undefined?PG[k]:null};
function guardsOf(c){   // daftar penjaga + porsi pemilik (%) untuk siklus c
  const m=modeOf(c),leg=(fs,pp)=>({pp,list:fs.map(f=>({n:nameOf(c,f),t:'bagi',g:0}))});
  if(m==='pemilik_suami_istri')return{pp:100,list:[]};
  if(m==='pemilik_1_karyawan')return leg(['k1'],75);
  if(m==='karyawan_suami_istri')return leg(['k1'],50);
  if(m==='dua_karyawan')return leg(['k1','k2'],50);
  const p=pgOf(c)||{};
  if(m==='suami_istri_gaji'){const g=(p.list||[])[0]||{};return{pp:100,list:[{n:(g.n||'').trim()||nameOf(c,'k1'),t:'gaji',g:+g.g||0}]}}
  const pp=p.pp!==undefined&&p.pp!==''&&isFinite(+p.pp)?Math.min(100,Math.max(0,+p.pp)):50;
  return{pp,list:(p.list||[]).map(g=>({n:(g.n||'').trim()||'Penjaga',t:g.t==='gaji'?'gaji':'bagi',g:+g.g||0}))};
}
const seedPG=(c,nm)=>{if(!isCust(nm)||PG[c])return;const o=guardsOf(c);   // dipanggil sebelum mode diganti
  PG[c]=nm==='kustom'?{pp:o.list.some(g=>g.t==='bagi')?o.pp:50,list:o.list.map(g=>({n:g.n,t:g.t,g:g.g}))}:{list:[{n:o.list[0]?o.list[0].n:nameOf(c,'k1'),t:'gaji',g:o.list[0]?o.list[0].g:0}]}};

const parseCSV=t=>{const o=[];let r=[],f='',q=false;t=t.replace(/^\uFEFF/,'');for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);o.push(r);r=[];f=''}else f+=c}if(f||r.length){r.push(f);o.push(r)}return o.filter(x=>x.some(y=>y.trim()))};
const MON={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Mei:5,Jun:6,Jul:7,Aug:8,Agu:8,Sep:9,Oct:10,Okt:10,Nov:11,Dec:12,Des:12};
const toISO=s=>{s=String(s).trim();let m=s.match(/^(\d{4})-(\d\d)-(\d\d)/);if(m)return`${m[1]}-${m[2]}-${m[3]}`;m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;m=s.match(/^\w{3} (\w{3}) (\d{1,2}) (\d{4})/);if(m&&MON[m[1]])return`${m[3]}-${String(MON[m[1]]).padStart(2,'0')}-${m[2].padStart(2,'0')}`;return null};
function csvToRecords(text){
  const rows=parseCSV(text),h=rows.shift().map(x=>x.trim().toLowerCase()),ix=(...n)=>h.findIndex(x=>n.includes(x));
  const iD=ix('tanggal','date'),iC=ix('siklus','cycle'),iY=ix('harike','day'),iO=ix('omsetkotor','omset'),iT=ix('tabungan'),iA=ix('pengeluaran'),iN=ix('catatanpengeluaran','expense');
  if(iD<0||iC<0||iO<0)throw new Error('header');
  const out=[],pc=new Set();
  rows.forEach(r=>{const date=toISO(r[iD]),omset=Math.round(+String(r[iO]).replace(/\D/g,''));if(!date||!omset)return;
    const amt=iA>=0?+String(r[iA]).replace(/\D/g,''):0,note=iN>=0?(r[iN]||''):'';
    const ex=iA>=0?[note,amt?'Rp '+amt.toLocaleString('id-ID'):''].filter(Boolean).join(' - '):note;
    if(iT>=0&&omset)pc.add(Math.round(+String(r[iT]).replace(/\D/g,'')/omset*1000)/10);
    out.push({date,cycle:+r[iC]||1,day:Math.min(30,Math.max(1,+r[iY]||1)),omset,expense:ex})});
  return{rows:out,pct:pc.size===1?[...pc][0]:null}
}
async function gas(url,o){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)});return r.json()} // semua panggilan ke server Sheet lewat POST; kode akses tidak boleh ada di URL
const syncUrl=()=>(API_BASE||location.origin)+'/api/sync';
// Premium aktif -> tukar kode lisensi dengan Kode Pemilik di server pusat (tanpa Google Sheet). Pengguna yang memakai Sheet sendiri tidak diubah.
async function autoRegister(silent){
  if(!G.premium||!G.lic||!G.lic.code||!navigator.onLine||G.staff)return false;
  if(S.url&&S.url!==syncUrl())return false;
  try{const r=await gas(syncUrl(),{action:'register',code:G.lic.code,device:G.dev});
    if(r.ok&&r.key){S.url=syncUrl();S.okey=r.key;save();if(!silent)toast('Sync cloud siap');return true}
