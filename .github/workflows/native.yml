name: Build APK Native

# Membangun aplikasi Android native (Capacitor) dengan ID com.rf_uangku.app, terpisah dari APK TWA.
# Seluruh web dibundel di dalam APK (jalan tanpa Chrome). Jalankan: Actions > Build APK Native > Run workflow.
on:
  workflow_dispatch:
  # Setiap push dibangun (cabang fitur: untuk memastikan lolos kompilasi). Push ke main otomatis terbit di Releases.
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: write

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PUBLISH: ${{ github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi dan bangun web
        env:
          # Kunci publik Supabase (bukan service_role). Isi sebagai secret repositori.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Tolak kunci rahasia Supabase
        env:
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Kunci secret/service_role tidak boleh masuk ke APK (bisa dibongkar siapa pun).
          if printf '%s' "$KEY" | grep -q '^sb_secret_'; then
            echo "::error::SUPABASE_ANON_KEY berisi kunci SECRET (sb_secret_...). Pakai kunci anon/publishable."; exit 1
          fi
          payload=$(printf '%s' "$KEY" | cut -d. -f2 | tr '_-' '/+')
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          payload="$payload$(printf '=%.0s' $(seq 1 $pad))"
          if [ "$pad" -lt 4 ] && printf '%s' "$payload" | base64 -d 2>/dev/null | grep -q '"role":"service_role"'; then
            echo "::error::SUPABASE_ANON_KEY berisi kunci service_role. Pakai kunci anon/publishable."; exit 1
          fi

      - name: Periksa konfigurasi Supabase
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::warning::Secret SUPABASE_URL / SUPABASE_ANON_KEY belum diisi: sinkronisasi cloud tidak aktif di APK ini (lihat docs/ANDROID.md)."
          fi

      - name: Pasang Capacitor (tanpa mengubah package.json)
        run: |
          npm install --no-save --no-package-lock \
            @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7 @capacitor/browser@7 @capacitor/local-notifications@7

      - name: Buat proyek Android
        run: |
          # cap sync hanya mendaftarkan plugin yang tercantum di package.json (salinan di runner ini saja, tidak di-commit).
          npm pkg set dependencies.@capacitor/app=7 dependencies.@capacitor/browser=7 dependencies.@capacitor/local-notifications=7
          npx cap add android
          npx cap sync android
          grep -E "App|Browser|LocalNotifications" android-native/app/src/main/assets/capacitor.plugins.json
          grep -q LocalNotifications android-native/app/src/main/assets/capacitor.plugins.json
          python3 - <<'PY'
          p = 'android-native/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perm = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          if 'POST_NOTIFICATIONS' not in s:
              s = s.replace('</manifest>', perm + '</manifest>')
          open(p, 'w').write(s)
          # Ikon kecil notifikasi (lonceng) agar tidak memakai ikon bawaan sistem.
          import os
          os.makedirs('android-native/app/src/main/res/drawable', exist_ok=True)
          open('android-native/app/src/main/res/drawable/ic_stat_icon_config_sample.xml', 'w').write('''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.9,2 2,2zM18,16v-5c0,-3.07 -1.63,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5s-1.5,0.67 -1.5,1.5v0.68C7.64,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z"/></vector>''')
          PY
          python3 - <<'PY'
          import re
          p = 'android-native/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          link = '''
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="rfuangku" android:host="auth" />
                  <data android:scheme="rfuangku" android:host="new" />
                  <data android:scheme="rfuangku" android:host="update" />
              </intent-filter>'''
          i = s.index('</intent-filter>') + len('</intent-filter>')
          s = s[:i] + link + s[i:]
          open(p, 'w').write(s)
          PY
          grep -c rfuangku android-native/app/src/main/AndroidManifest.xml

          # Status bar dan navigation bar transparan: aplikasi digambar sampai di belakangnya (inset ditangani CSS).
          python3 - <<'PY'
          import re
          p = 'android-native/app/src/main/res/values/styles.xml'
          s = open(p).read()
          items = '''
              <item name="android:statusBarColor">@android:color/transparent</item>
              <item name="android:navigationBarColor">@android:color/transparent</item>'''
          s, n = re.subn(r'(<style name="AppTheme\.NoActionBar"[^>]*>)', lambda m: m.group(1) + items, s, count=1)
          assert n == 1, 'style AppTheme.NoActionBar tidak ditemukan'
          open(p, 'w').write(s)
          PY
          cat android-native/app/src/main/res/values/styles.xml

      - name: Pasang widget saldo layar utama
        run: |
          app=android-native/app/src/main
          cp android-native-patch/java/*.java $app/java/com/rf_uangku/app/
          cp android-native-patch/res/layout/*.xml $app/res/layout/
          mkdir -p $app/res/drawable $app/res/xml
          cp android-native-patch/res/drawable/*.xml $app/res/drawable/
          cp android-native-patch/res/xml/*.xml $app/res/xml/
          cp android-native-patch/res/values-strings.xml $app/res/values/widget_strings.xml
          python3 - <<'PY'
          p = 'android-native/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          def receiver(cls, info):
              return f'''
              <receiver android:name=".{cls}" android:exported="false">
                  <intent-filter>
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                  </intent-filter>
                  <meta-data android:name="android.appwidget.provider" android:resource="@xml/{info}" />
              </receiver>'''
          receiver = (receiver('BalanceWidgetProvider', 'balance_widget_info')
                      + receiver('AccountsWidgetProvider', 'accounts_widget_info')
                      + receiver('TrendWidgetProvider', 'trend_widget_info')
                      + receiver('CompactWidgetProvider', 'compact_widget_info')
                      + receiver('DueWidgetProvider', 'due_widget_info') + '\n          ')
          receiver += '''
              <service android:name=".BankNotificationListener" android:exported="true"
                  android:label="RF Uangku"
                  android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                  <intent-filter>
                      <action android:name="android.service.notification.NotificationListenerService" />
                  </intent-filter>
              </service>
          '''
          if 'REQUEST_INSTALL_PACKAGES' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application', 1)
          for perm in ('USE_EXACT_ALARM', 'SCHEDULE_EXACT_ALARM'):
              if perm not in s:
                  s = s.replace('<application', f'<uses-permission android:name="android.permission.{perm}" />\n    <application', 1)
          if 'USE_BIOMETRIC' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application', 1)
          assert '</application>' in s
          s = s.replace('</application>', receiver + '</application>', 1)
          open(p, 'w').write(s)
          PY
          grep -c WidgetProvider $app/AndroidManifest.xml

      - name: Izinkan berkas pembaruan lewat FileProvider
        run: |
          python3 - <<'PY'
          p = 'android-native/app/src/main/res/xml/file_paths.xml'
          s = open(p).read()
          if 'cache-path' not in s:
              s = s.replace('</paths>', '    <cache-path name="rf_updates" path="updates/" />\n</paths>', 1)
              open(p, 'w').write(s)
          PY
          cat android-native/app/src/main/res/xml/file_paths.xml
          grep -c "fileprovider" android-native/app/src/main/AndroidManifest.xml

      - name: Pasang ikon aplikasi
        run: |
          find android-native/app/src/main/res -name 'ic_launcher.png' -exec cp public/icons/icon-512.png {} \;
          find android-native/app/src/main/res -name 'ic_launcher_round.png' -exec cp public/icons/icon-512.png {} \;
          find android-native/app/src/main/res -name 'ic_launcher_foreground.png' -exec cp public/icons/maskable-512.png {} \;

      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > signing.keystore
            [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$KEYSTORE_PASSWORD"
          else
            echo "::warning::Secret kunci belum diisi. APK memakai kunci sementara (hanya uji coba)."
            KEYSTORE_PASSWORD="sementara-$RANDOM$RANDOM"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS="android"
            keytool -genkeypair -keystore signing.keystore -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=RF Uangku sementara" > /dev/null
            echo "TEMP_KEY=1" >> "$GITHUB_ENV"
          fi
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "KS_PASS=$KEYSTORE_PASSWORD"
            echo "KEY_PASS=$KEY_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Atur versi
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i -E "s/versionCode [0-9]+/versionCode $((200 + GITHUB_RUN_NUMBER))/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" \
            android-native/app/build.gradle
          grep -n "versionCode\|versionName" android-native/app/build.gradle

      - name: Tambah WorkManager untuk cek pembaruan latar belakang
        run: |
          python3 - <<'PY'
          import re
          p = 'android-native/app/build.gradle'
          s = open(p).read()
          if 'androidx.work:work-runtime' not in s:
              s, n = re.subn(r'^dependencies \{', 'dependencies {\n    implementation "androidx.work:work-runtime:2.9.1"', s, count=1, flags=re.M)
              assert n == 1, 'blok dependencies tidak ditemukan'
              open(p, 'w').write(s)
          PY
          grep -n "work-runtime" android-native/app/build.gradle

      - name: Bangun APK (Gradle)
        working-directory: android-native
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$GITHUB_WORKSPACE/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$GITHUB_WORKSPACE/signing.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$GITHUB_WORKSPACE/rf-uangku-native.apk" "$GITHUB_WORKSPACE/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$GITHUB_WORKSPACE/rf-uangku-native.apk" | head -n 3

      - name: Unggah hasil
        uses: actions/upload-artifact@v4
        with:
          name: rf-uangku-native-apk
          path: rf-uangku-native.apk
          retention-days: 30

      - name: Terbitkan ke Releases
        if: env.PUBLISH == 'true' && env.TEMP_KEY != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          FIXED="Aplikasi Android native (Capacitor), ID com.rf_uangku.app. Pasang di atas versi lama; data tetap ada. Terpisah dari APK TWA; samakan data lewat sinkronisasi Supabase."
          # Catatan perubahan = isi pesan commit (judul + butir), tanpa jejak penulis; keterangan tetap setelah garis ---.
          CHANGES="$(printf '%s' "$COMMIT_MESSAGE" | grep -v -i -E '^(co-authored-by|claude-session|🤖|https?://)' || true)"
          if [ -n "$CHANGES" ]; then NOTES="$CHANGES"$'\n\n---\n'"$FIXED"; else NOTES="$FIXED"; fi
          gh release create "native-v${APP_VERSION}-${GITHUB_RUN_NUMBER}" rf-uangku-native.apk \
            --title "RF Uangku Native v${APP_VERSION} (#${GITHUB_RUN_NUMBER})" \
            --latest \
            --notes "$NOTES"
